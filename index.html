<!DOCTYPE html>
<html lang="fr">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3YQSC47659"></script>

    <script>

    function gtag(){
        dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', 'G-3YQSC47659');

    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cap Contrôle</title>
    <link rel="icon" href="assets/logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <div id="loginScreen">
    
        <h2 id="authTitle">Connexion</h2>
    
        <div id="loginForm">
    
            <input
                type="email"
                id="loginEmail"
                placeholder="Adresse e-mail"
            >
    
            <input
                type="password"
                id="loginPassword"
                placeholder="Mot de passe"
            >
    
            <button onclick="login()" id="log-button">
                Connexion
            </button>
    
            <p class="auth-switch">
                Pas encore de compte
                <button
                    type="button"
                    class="text-button"
                    id="create"
                    onclick="showRegister()">
                    Créer un compte
                </button>
            </p>
    
        </div>
    
    
        <div id="registerForm" style="display:none;">
    
            <input
                type="text"
                id="registerUsername"
                placeholder="Pseudo"
            >
    
            <input
                type="email"
                id="registerEmail"
                placeholder="Adresse e-mail"
            >
    
            <input
                type="password"
                id="registerPassword"
                placeholder="Mot de passe"
            >
    
            <input
                type="password"
                id="registerPasswordConfirm"
                placeholder="Confirmer le mot de passe"
            >
    
            <button onclick="register()">
                Créer mon compte
            </button>
    
            <p class="auth-switch">
                Déjà un compte
                <button
                    type="button"
                    class="text-button"
                    onclick="showLogin()">
                    Se connecter
                </button>
            </p>
    
        </div>
    
    </div>

    <div id="app" style="display:none;">

    <div class="container">

        <h1>
            Cap Contrôle
        </h1>

        <div id="dashboard" class="dashboard"></div>

        <div id="nextExam" class="card next-exam"></div>

        <div id="todayRevision" class="card today-revision"></div>

        <div class="card form">

            <input
                id="subject"
                type="text"
                placeholder="Matière"
            >

            <input
                id="chapter"
                type="text"
                placeholder="Chapitre"
            >

            <input
                id="date"
                type="date"
            >

            <button id="addBtn">
                Ajouter
            </button>

        </div>

        <div id="controls"></div>

        <div class="card ai-section">

            <textarea
                id="courseInput"
                placeholder="Colle ton cours ici..."
            ></textarea>

            <button
                class="generate-btn"
                onclick="generateRevisionSheet()">
                Générer ma fiche
            </button>

        </div>

        <div id="aiResult"></div>

        <div class="card share-card">

            <h2 id="share-text">Importer une fiche</h2>

            <div class="share-import">

                <input
                    id="shareCode"
                    type="text"
                    placeholder="Code de partage">

                <button
                    id="importBtn"
                    onclick="importSheet()">
                    Importer
                </button>

            </div>

        </div>

        <div class="card">
            <h2 id=share-text>Historique des fiches</h2>

            <input
                type="text"
                id="historySearch"
                placeholder="Rechercher une fiche..."
                oninput="renderHistory()"
            >
        
            <div id="historyList"></div>
        </div>

        <div class="footer-links">

    <a
        class="support-link"
        href="https://paypal.me/capcontrole"
        target="_blank">
        Soutenir Cap Contrôle
    </a>

    <span class="copyright">
        © 2026 Cap Contrôle
    </span>

</div>

    </div>

    <script src="script.js"></script>

    </div>

</body>
</html>
